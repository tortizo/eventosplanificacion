<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITULO DE LA PAGINA</title>
    <link rel="icon" type="image/png" href="img/logo-unemi.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Select2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <!-- DataTable -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">

    <!-- JS Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <style>
        body {
            font-family: 'Roboto','Open Sans', Arial, sans-serif;
            background-color: #ffffff;
            color: #1D2B4F;}

        .logo-tigre {
            height: 60px;
            object-fit: contain;}

        .logo-unemi {
            height: 50px;
            object-fit: contain;}

        .franja-superior {
            background-color: #1D2B4F;
            color: white;
            font-size: 22px;
            font-weight: bold;
            vertical-align: middle;}

        .franja-naranja {
            height: 10px;
            background-color: #F39200;}

    </style>
</head>
<body>
<!-- Encabezado -->
<div class="franja-superior d-flex justify-content-between align-items-center px-3">
  <div class="d-flex align-items-center">
    <img src="img/logo-unemi.png" alt="Logo" class="logo-tigre">
  </div>
  <div class="text-center flex-grow-1">
    <h2 style="color:white;" class="fw-bold">Planificación de Eventos</h2>
  </div>
  <div class="d-flex align-items-center justify-content-end">
    <img src="img/unemi-logo.png" alt="Logo" class="logo-unemi">
  </div>
</div>
<div class="franja-naranja"></div>

<!-- Contenido -->
<!-- Detalle Eventos -->
<div class="container mt-4">
  <div class="course-container">
    <div class="titulo-seccion">DATOS SOLICITANTE</div>

<div class="container mt-4">
  <div class="row mb-4">
    <div class="col-md-6">
      <label for="solicitante" class="form-label fw-bold">Nombre del solicitante:</label>
      <input type="text" class="form-control" id="solicitante" name="solicitante" required>
    </div>
    <div class="col-md-6">
      <label for="unidad" class="form-label fw-bold">Nombre de la Unidad Organizacional:</label>
      <input type="text" class="form-control" id="unidad" name="unidad" required>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-6">
      <label for="correo" class="form-label fw-bold">Correo institucional:</label>
      <input type="email" class="form-control" id="correo" name="correo" required>
    </div>
  </div>
</div>

<!-- Detalle Eventos -->
<div class="container mt-4">
  <div class="course-container">
    <div class="titulo-seccion">DETALLE EVENTOS</div>

    <form id="miFormulario">
      <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle text-center" id="tablaEventos">
          <thead class="table-dark">
            <tr>
              <th style="min-width: 200px;">Tipo de Evento</th>
              <th style="min-width: 180px;">Nombre del Evento</th>
              <th style="min-width: 130px;">Fecha Inicio Tentativa</th>
              <th style="min-width: 130px;">Fecha Fin Tentativa</th>
              <th style="min-width: 100px;">Número de Participantes</th>
              <th style="min-width: 250px;">Descripción del evento</th>
              <th style="min-width: 60px;">Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-start mt-3">
        <button type="button" class="btn btn-outline-success" onclick="agregarFila()">+ Añadir nueva fila</button>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-4 py-2">Enviar formulario</button>
      </div>
    </form>
  </div>
</div>

<!-- Estilo para el encabezado de sección -->
<style>
  .titulo-seccion {
    background-color: #e5e5e5;
    font-weight: bold;
    padding: 10px 15px;
    border-radius: 6px;
    font-size: 16px;
    margin-bottom: 20px;
  }
</style>

<script>
  const webAppUrl = 'https://script.google.com/macros/s/AKfycbzcNVXUXEa0GPt_A-FEXi-Mol3tPgTjR2onS_rXqFyNqFVmbw3_tJWn0nbfBSnf-BwoFA/exec';
  function formatearFechaHora(fecha) {
    const fechaObj = new Date(fecha);
    const fechaFormateada = fechaObj.toLocaleDateString('es-EC', {
      day: '2-digit', month: '2-digit', year: 'numeric'
    });
    return `${fechaFormateada}`;
  }
const tiposEventos = [
  "Sesión Solemne de Aniversario Institucional",
  "Audiencia Pública de Rendición de Cuentas, dispuesta por el Consejo de Participación Ciudadana y Control Social",
  "Aniversario de fundación de las facultades",
  "Ceremonias de graduación de grado y posgrado",
  "Ceremonia Honoris Causa",
  "Congresos, seminarios, simposios, encuentros, foros, talleres o jornadas, entre otros",
  "Socialización de planes de las unidades organizacionales",
  "Ceremonia de bienvenida al inicio de periodo académico",
  "Casas abiertas de las facultades",
  "Socialización de resultados de actividades y/o proyectos de vinculación e investigación",
  "Entrega de Reconocimiento por rendimiento académico",
  "Momento Cívico",
  "Firma de convenios interinstitucionales y/o de cooperación interinstitucional",
  "Ferias emprendedoras",
  "Festival",
  "Novatada Cultural Institucional"
];

function agregarFila() {
  const fila = document.createElement("tr");
  fila.innerHTML = `
    <td>
      <select class="form-select" name="tipo_evento[]" required>
        <option value="">Seleccione</option>
        ${tiposEventos.map(op => `<option>${op}</option>`).join('')}
      </select>
    </td>
    <td><input type="text" class="form-control" name="nombre_evento[]" required></td>
    <td><input type="date" class="form-control" name="fecha_inicio[]" required></td>
    <td><input type="date" class="form-control" name="fecha_fin[]" required></td>
    <td><input type="number" class="form-control" name="participantes[]" min="1" required></td>
    <td><textarea class="form-control" name="descripcion[]" rows="1" required></textarea></td>
    <td>
      <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">✕</button>
    </td>
  `;
  document.getElementById("cuerpoTabla").appendChild(fila);
}

// Agrega una fila al cargar
window.onload = agregarFila;
document.getElementById("miFormulario").addEventListener("submit", async function (e) {
  e.preventDefault();

  // DATOS DEL SOLICITANTE
  const nombre = document.getElementById("solicitante").value;
  const unidad = document.getElementById("unidad").value;
  const correo = document.getElementById("correo").value;

  // RECOGER FILAS DE LA TABLA
  const filas = document.querySelectorAll("#cuerpoTabla tr");
  const eventos = [];

  filas.forEach(fila => {
    const tipo_evento = fila.querySelector('select[name="tipo_evento[]"]').value;
    const nombre_evento = fila.querySelector('input[name="nombre_evento[]"]').value;
    const fecha_inicio = fila.querySelector('input[name="fecha_inicio[]"]').value;
    const fecha_fin = fila.querySelector('input[name="fecha_fin[]"]').value;
    const participantes = fila.querySelector('input[name="participantes[]"]').value;
    const descripcion = fila.querySelector('textarea[name="descripcion[]"]').value;

    eventos.push({
      tipo_evento,
      nombre_evento,
      fecha_inicio,
      fecha_fin,
      participantes,
      descripcion
    });
  });

  // ESTRUCTURA DE DATOS A ENVIAR
  const payload = {
    nombre,
    unidad,
    correo,
    eventos
  };

  // ENVÍO AL APPS SCRIPT
  try {
    const response = await fetch(webAppUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const resultText = await response.text();
    let result;
    try {
      result = JSON.parse(resultText);
    } catch (e) {
      throw new Error("Respuesta inválida del servidor: " + resultText);
    }

    if (result.success) {
      Swal.fire({
        icon: "success",
        title: "Formulario enviado correctamente",
        text: "Todos los eventos han sido registrados"
      });

      this.reset();
      document.getElementById("cuerpoTabla").innerHTML = "";
      agregarFila();
    } else {
      throw new Error(result.message || "Error del servidor");
    }

  } catch (error) {
    console.error("Error:", error);
    Swal.fire({
      icon: "error",
      title: "Error al enviar",
      text: error.message
    });
  }
});
</script>
</body>
</html>
