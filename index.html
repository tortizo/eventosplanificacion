<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PLANIFICACIÓN DE EVENTOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Roboto', 'Open Sans', Arial, sans-serif; background-color: #ffffff; color: #1D2B4F; }
    .franja-superior { background-color: #1D2B4F; color: white; font-size: 22px; font-weight: bold; }
    .franja-naranja { height: 10px; background-color: #F39200; }
    .titulo-seccion { background-color: #e5e5e5; font-weight: bold; padding: 10px 15px; border-radius: 6px; font-size: 16px; margin-bottom: 20px; }
    .table-wrapper { overflow-x: auto; }
  </style>
</head>
<body>

<div class="franja-superior d-flex justify-content-between align-items-center px-3">
  <div class="text-center flex-grow-1">
    <h2 style="color:white;" class="fw-bold">Planificación de Eventos</h2>
  </div>
</div>
<div class="franja-naranja"></div>

<div class="container mt-4">
  <div class="titulo-seccion">DATOS SOLICITANTE</div>
  <form id="formularioEvento">
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Nombre del solicitante:</label>
        <input type="text" class="form-control" id="nombre" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold">Unidad organizacional:</label>
        <input type="text" class="form-control" id="unidad" required>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">Correo institucional:</label>
        <input type="email" class="form-control" id="correo" required>
      </div>
    </div>

    <div class="titulo-seccion d-flex justify-content-between align-items-center">
      DETALLE DE EVENTOS
      <button type="button" class="btn btn-outline-primary btn-sm" onclick="mostrarFormularioDetalle()">+ Añadir evento</button>
    </div>

    <div class="table-wrapper">
      <table class="table table-bordered mt-4 text-center">
        <thead class="table-secondary">
          <tr>
            <th>Nombre Evento</th>
            <th>Categoría</th>
            <th>Tipo Evento</th>
            <th>Espacio</th>
            <th>Fecha Inicio</th>
            <th>Fecha Fin</th>
            <th>Hora Inicio</th>
            <th>Hora Fin</th>
            <th>Participantes</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaResumen"></tbody>
      </table>
    </div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary">Enviar formulario</button>
    </div>
  </form>
</div>

<!-- Detalle fuera del form -->
<div id="detalleEvento" style="display:none;" class="container mt-4"></div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbzcNVXUXEa0GPt_A-FEXi-Mol3tPgTjR2onS_rXqFyNqFVmbw3_tJWn0nbfBSnf-BwoFA/exec";
const tiposPorCategoria = {
  "Eventos Solemnes": [
    "Sesión Solemne de Aniversario Institucional",
    "Audiencia Pública de Rendición de Cuentas, dispuesta por el Consejo de Participación Ciudadana y Control Social",
    "Aniversario de fundación de las facultades",
    "Ceremonias de graduación de grado y posgrado",
    "Ceremonia Honoris Causa"
  ],
  "Eventos Institucionales": [
    "Congresos, seminarios, simposios, encuentros, foros, talleres o jornadas, entre otros.",
    "Socialización de planes de las unidades organizacionales",
    "Ceremonia de bienvenida al inicio de periodo académico",
    "Casas abiertas de las facultades",
    "Socialización de resultados de actividades y/o proyectos de vinculación e investigación",
    "Entrega de Reconocimiento por rendimiento académico",
    "Momento Cívico"
  ],
  "Eventos Interinstitucionales": ["Firma de convenios interinstitucionales y/o de cooperación interinstitucional."],
  "Eventos Culturales": ["Ferias emprendedoras", "Festival", "Novatada Cultural Institucional"]
};

const espacios = ["Auditorio A", "Auditorio V", "Auditorio W", "Plaza de integración", "Corredor Cultural", "Plazoleta"];
let eventos = [];
let editarIndex = -1;

function mostrarFormularioDetalle(index = -1) {
  editarIndex = index;
  const evento = eventos[index] || {};
  document.getElementById('detalleEvento').innerHTML = `
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Categoría</label>
        <select class="form-select" id="categoria" onchange="actualizarTipoEvento()">
          <option value="">Seleccione</option>
          ${Object.keys(tiposPorCategoria).map(cat => `<option ${evento.categoria===cat?"selected":''}>${cat}</option>`).join('')}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Tipo Evento</label>
        <select class="form-select" id="tipo_evento"></select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Nombre Evento</label>
        <input type="text" class="form-control" id="nombre_evento" value="${evento.nombre_evento||''}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Participantes</label>
        <input type="number" class="form-control" id="participantes" value="${evento.participantes||''}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Nombre Espacio</label>
        <select class="form-select" id="espacio">
          <option value="">Seleccione</option>
          ${espacios.map(e => `<option ${evento.espacio===e?"selected":''}>${e}</option>`).join('')}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">Alcance</label>
        <select class="form-select" id="alcance">
          <option value="">Seleccione</option>
          <option ${evento.alcance==='Nacional'?'selected':''}>Nacional</option>
          <option ${evento.alcance==='Internacional'?'selected':''}>Internacional</option>
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-3">
        <label class="form-label">Fecha Inicio</label>
        <input type="date" class="form-control" id="fecha_inicio" value="${evento.fecha_inicio||''}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Fecha Fin</label>
        <input type="date" class="form-control" id="fecha_fin" value="${evento.fecha_fin||''}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Hora Inicio</label>
        <input type="time" class="form-control" id="hora_inicio" value="${evento.hora_inicio||''}" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Hora Fin</label>
        <input type="time" class="form-control" id="hora_fin" value="${evento.hora_fin||''}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-12">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" id="descripcion" rows="2">${evento.descripcion || ''}</textarea>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">Responsable</label>
        <input type="text" class="form-control" id="responsable" value="${evento.responsable||''}">
      </div>
      <div class="col-md-6">
        <label for="celular" class="form-label">Celular:</label>
        <input type="tel" class="form-control" id="celular"
          name="celular"
          pattern="^[0-9]{10}$"
          maxlength="10"
          inputmode="numeric"
          placeholder="Ej: 0987654321"
          oninvalid="this.setCustomValidity('Debe ingresar exactamente 10 números.')"
          oninput="this.setCustomValidity('')"
          value="${evento.celular||''}"
          required>
      </div>
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-success" onclick="guardarEvento()">Guardar Evento</button>
    </div>
  `;

  document.getElementById("detalleEvento").style.display = "block";
  // Validación dinámica: Fecha Fin no puede ser menor que Fecha Inicio
setTimeout(() => {
  const fechaInicioInput = document.getElementById('fecha_inicio');
  const fechaFinInput = document.getElementById('fecha_fin');

  if (fechaInicioInput && fechaFinInput) {
    const validarFechas = () => {
      const inicio = new Date(fechaInicioInput.value);
      const fin = new Date(fechaFinInput.value);

      if (fechaInicioInput.value && fechaFinInput.value && fin < inicio) {
        Swal.fire({
          icon: 'warning',
          title: 'Fecha no válida',
          text: 'La fecha de fin no puede ser menor a la fecha de inicio.'
        });
        fechaFinInput.value = '';
      }
    };

    fechaInicioInput.addEventListener('change', validarFechas);
    fechaFinInput.addEventListener('change', validarFechas);
  }
}, 0);

  actualizarTipoEvento(evento.tipo_evento);
  // Validación del campo celular para permitir solo números
setTimeout(() => {
      const inputCelular = document.getElementById('celular');
      if (inputCelular) {
        inputCelular.addEventListener('input', function (e) {
          this.value = this.value.replace(/[^0-9]/g, '');
// Asegura que si el primer dígito es eliminado, no se pierda el 0 al inicio
      if (this.value.length > 0 && this.value.charAt(0) !== '0') {
        this.value = '0' + this.value;
      }

      // Limita a máximo 10 caracteres
      if (this.value.length > 10) {
        this.value = this.value.slice(0, 10);
      }

    });
  }
}, 0);
}

function actualizarTipoEvento(seleccionada = "") {
  const categoria = document.getElementById("categoria").value;
  const tipo_evento = document.getElementById("tipo_evento");
  tipo_evento.innerHTML = "<option value=''>Seleccione</option>" + (tiposPorCategoria[categoria]||[]).map(e => `<option ${e===seleccionada?"selected":''}>${e}</option>`).join('');
  tipo_evento.addEventListener('change', validarCamposDeFechas); // Vincula validación dinámica al cambio de tipo
  validarCamposDeFechas(); // Llama inmediatamente para validar si ya viene precargado
}
function validarCamposDeFechas() {
  const categoria = document.getElementById("categoria").value;
  const tipoEvento = document.getElementById("tipo_evento").value;

  const filaFechas = document.querySelectorAll("#fecha_inicio, #fecha_fin, #hora_inicio, #hora_fin");

  const esEventoGraduacion = (
    categoria === "Eventos Solemnes" &&
    tipoEvento === "Ceremonias de graduación de grado y posgrado"
  );

  filaFechas.forEach(input => {
    const formGroup = input.closest('.col-md-3') || input.closest('.col-md-6');

    if (esEventoGraduacion) {
      input.required = false;
      input.value = ''; // Limpia el campo
      if (formGroup) formGroup.style.display = 'none';
    } else {
      input.required = true;
      if (formGroup) formGroup.style.display = 'block';
    }
  });
}

function guardarEvento() {

  const evento = {
    categoria: document.getElementById("categoria").value,
    tipo_evento: document.getElementById("tipo_evento").value,
    nombre_evento: document.getElementById("nombre_evento").value,
    espacio: document.getElementById("espacio").value,
    fecha_inicio: document.getElementById("fecha_inicio").value,
    hora_inicio: document.getElementById("hora_inicio").value,
    fecha_fin: document.getElementById("fecha_fin").value,
    hora_fin: document.getElementById("hora_fin").value,
    participantes: document.getElementById("participantes").value,
    alcance: document.getElementById("alcance").value,
    descripcion: document.getElementById("descripcion").value,
    responsable: document.getElementById("responsable").value,
    celular: "'" + document.getElementById("celular").value
  };


  if (editarIndex >= 0) eventos[editarIndex] = evento;
  else eventos.push(evento);

  document.getElementById("detalleEvento").style.display = "none";
  mostrarTablaResumen();
}

function mostrarTablaResumen() {
  const tbody = document.getElementById("tablaResumen");
  tbody.innerHTML = eventos.map((e, i) => `
    <tr>
      <td>${e.nombre_evento}</td>
      <td>${e.categoria}</td>
      <td>${e.tipo_evento}</td>
      <td>${e.espacio}</td>
      <td>${e.fecha_inicio}</td>
      <td>${e.fecha_fin}</td>
      <td>${e.hora_inicio}</td>
      <td>${e.hora_fin}</td>
      <td>${e.participantes}</td>
      <td>
        <button type="button" class='btn btn-sm btn-warning' onclick='mostrarFormularioDetalle(${i})'>Editar</button>
        <button class='btn btn-sm btn-danger' onclick='eliminarEvento(${i})'>Eliminar</button>
      </td>
    </tr>
  `).join('');
}

function eliminarEvento(index) {
  eventos.splice(index, 1);
  mostrarTablaResumen();
}

document.getElementById("formularioEvento").addEventListener("submit", async function(e) {
  e.preventDefault();

   Swal.fire({
    title: 'Enviando...',
    text: 'Se está enviando la información, por favor espere.',
    allowOutsideClick: false,
    allowEscapeKey: false,
    didOpen: () => {
      Swal.showLoading();
    }
  });

  const formData = new FormData();
  formData.append("nombre", document.getElementById("nombre").value);
  formData.append("unidad", document.getElementById("unidad").value);
  formData.append("correo", document.getElementById("correo").value);
  formData.append("eventos", JSON.stringify(eventos));

  try {
    const res = await fetch(scriptURL, { method: "POST", body: formData });
    const data = await res.json();
    if (data.status === "ok") {
      Swal.fire({ icon: "success", title: "Formulario enviado", text: "Los eventos han sido registrados" });
      this.reset(); eventos = []; mostrarTablaResumen();
    } else throw new Error(data.message);
  } catch (err) {
    Swal.fire({ icon: "error", title: "Error", html: err.message });
  }
});
</script>
</body>
</html>
